# Fair Housing Flagged Terms
# --------------------------
# Each category maps to a list of regex patterns and suggested replacements.
# Add/remove entries per jurisdiction.  Patterns are case-insensitive.

race_color:
  - pattern: '\b(white|black|african[- ]american|hispanic|latino|asian|caucasian)\s+(neighborhood|community|area)\b'
    suggestion: "Describe property features, not demographics."
  - pattern: '\bhistoric\s+(black|white|asian|latino)\b'
    suggestion: "Remove demographic references; describe the historic architecture instead."

religion:
  - pattern: '\bnear\s+(church|mosque|synagogue|temple)\b'
    suggestion: "Remove proximity to religious institutions; use 'near community amenities' if needed."
  - pattern: '\b(christian|jewish|muslim|catholic|hindu)\s+(community|neighborhood)\b'
    suggestion: "Describe the property, not the religious makeup of the area."

familial_status:
  - pattern: '\b(family[- ]friendly|great\s+for\s+(families|kids|children|couples))\b'
    suggestion: "Replace with objective features, e.g. 'spacious backyard' or 'near parks'."
  - pattern: '\b(no\s+children|adults?\s+only|senior\s+(community|living))\b'
    suggestion: "Remove age/familial restriction unless legally exempt (e.g. 55+ community)."
  - pattern: '\b(perfect\s+for\s+(young|growing)\s+(couple|family))\b'
    suggestion: "Describe property attributes, not ideal occupants."
  - pattern: '\b(bachelor\s+pad|empty[- ]nester)\b'
    suggestion: "Describe the property, not the intended occupant type."

disability:
  - pattern: '\b(walking\s+distance)\b'
    suggestion: "Use 'close proximity to' or specific distances instead."
  - pattern: '\b(handicapped|crippled|disabled\s+person)\b'
    suggestion: "Use 'accessible' or describe specific ADA features."

sex_gender:
  - pattern: '\b(man\s+cave|she[- ]shed|mother[- ]in[- ]law)\b'
    suggestion: "Use 'bonus room', 'accessory dwelling unit', or 'guest suite'."
  - pattern: '\bmaster\s+(bed\s*room|suite|bath)\b'
    suggestion: "Use 'primary bedroom/suite/bath' per current industry guidance."

national_origin:
  - pattern: '\b(speaks?\s+english|english[- ]speaking)\b'
    suggestion: "Remove language preference; it implies national origin discrimination."

age:
  - pattern: '\b(young\s+professionals?|millennials?|retirees?)\b'
    suggestion: "Describe property features, not target demographics."
